<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Products</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.5/css/bootstrap.min.css}">
</head>
<body>
<div class="p-3">
    <table class="table">
        <thead>
        <th>ID</th><th>Name</th><th>Price</th><th>Quantity</th>
        </thead>
        <tbody>
        <tr th:each="p:${productList}">
            <td th:text="${p.id}"></td>
            <td th:text="${p.Name}"></td>
            <td th:text="${p.Price}"></td>
            <td th:text="${p.Quantity}"></td>
            <td>
                <a class="btn btn-danger" onclick="return confirm('Voulez vous supprimer ?')" th:href="@{/delete(id=${p.id})}">Delete</a>
            </td>

        </tr>
        </tbody>
        </table>
</div>
</body>
</html>
