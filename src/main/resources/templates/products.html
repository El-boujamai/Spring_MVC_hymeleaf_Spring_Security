<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"

      layout:decorate="layout"
      xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Products</title>
</head>
<body>
<div class="p-3" layout:fragment="content1">
    <div class="p-3" sec:authorize="hasRole('ADMIN')">
        <a class="btn btn-primary" th:href="@{/admin/newProduct}">New Product</a>
    </div>
    <table class="table">
        <thead>
        <th>ID</th><th>Name</th><th>Price</th><th>Quantity</th>
        </thead>
        <tbody>
        <tr th:each="p:${productList}">
            <td th:text="${p.id}"></td>
            <td th:text="${p.Name}"></td>
            <td th:text="${p.Price}"></td>
            <td th:text="${p.Quantity}"></td>
            <td>
                <a class="btn btn-danger" onclick="return confirm('Voulez vous supprimer ?')" th:href="@{/delete(id=${p.id})}">Delete</a>
            </td>

        </tr>
        </tbody>
        </table>
</div>
</body>
</html>
